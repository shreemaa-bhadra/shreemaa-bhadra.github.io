title: Cook's Pan
description: >-
  Recipes, notes, and stories from Shreemaa's Kitchen. Discover authentic Indian and fusion recipes with step-by-step instructions.
baseurl: ""
url: "https://cookspan.github.io/cookspan"
lang: en

author:
  name: Shreemaa Bhadra

theme: minima
minima:
  skin: classic

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

jekyll_seo_tag:
  type: WebSite

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Shreemaa Bhadra"
  - scope:
      path: ""
    values:
      image: /assets/logo.png

markdown: kramdown
permalink: pretty

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - scripts
